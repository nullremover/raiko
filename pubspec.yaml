
name: raiko
description: "Raiko. Break through your music player. built with Flutter."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  just_audio: ^0.10.6
  file_picker: ^10.3.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  icons_launcher: ^3.1.0

icons_launcher:
  image_path: "assets/Icon/raiko-icon.png"
  platforms:
    android:
      enable: true
    ios:
      enable: true
    web:
      enable: true
    windows:
      enable: true
    macos:
      enable: true
    linux:
      enable: true

flutter:
  uses-material-design: true

  fonts:
    - family: DelaGothicOne
      fonts:
        - asset: assets/fonts/delagothicone-regular.ttf

