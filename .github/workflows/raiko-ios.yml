
name: Raiko iOS Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-simulator:
    name: Build Raiko for iOS Simulator
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          xcodebuild -version

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Raiko
        run: flutter analyze
      
      - name: Build iOS IPA
        run: flutter build ipa --release --no-codesign

      - name: Package unsigned IPA for SideStore
        run: |
          set -euo pipefail

          IPA_PATH="build/ios/ipa"

          echo "Looking for generated IPA..."
          find "$IPA_PATH" -maxdepth 1 -name '*.ipa' -print

          IPA_FILE="$(find "$IPA_PATH" -maxdepth 1 -name '*.ipa' -print -quit)"

          if [ -z "$IPA_FILE" ]; then
            echo "No IPA was generated."
            exit 1
          fi

          cp "$IPA_FILE" raiko-ios-unsigned.ipa

      - name: Upload Raiko IPA
        uses: actions/upload-artifact@v4
        with:
          name: raiko-ios-ipa
          path: raiko-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

