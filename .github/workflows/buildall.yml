
name: Raiko CI and Builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true

      - run: flutter pub get
      - run: dart run icons_launcher:create
      - run: flutter build windows --release

      - uses: actions/upload-artifact@v4
        with:
          name: raiko-windows
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true

      - run: flutter pub get
      - run: dart run icons_launcher:create
      - run: flutter build linux --release

      - uses: actions/upload-artifact@v4
        with:
          name: raiko-linux
          path: build/linux/x64/release/bundle/
          if-no-files-found: error
          retention-days: 7

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true

      - run: flutter pub get
      - run: dart run icons_launcher:create
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: raiko-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

  web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true

      - run: flutter pub get
      - run: dart run icons_launcher:create
      - run: flutter build web --release --base-href /raiko/

      - uses: actions/upload-artifact@v4
        with:
          name: raiko-web
          path: build/web/
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web/

  ios:
    name: Build unsigned iOS IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          xcodebuild -version

      - run: flutter pub get
      - run: dart run icons_launcher:create
      - run: flutter build ipa --release --no-codesign

      - name: Package unsigned IPA for SideStore
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "Runner.app was not found in the Xcode archive."
            exit 1
          fi

          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/Runner.app

          ditto -c -k --sequesterRsrc --keepParent \
            Payload raiko-ios-unsigned.ipa

          unzip -l raiko-ios-unsigned.ipa |
            grep 'Payload/Runner.app/'

      - uses: actions/upload-artifact@v4
        with:
          name: raiko-ios-ipa
          path: raiko-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

  macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true

      - run: flutter pub get
      - run: dart run icons_launcher:create
      - run: flutter build macos --release

      - name: Package macOS app
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$(find build/macos/Build/Products/Release \
            -maxdepth 1 -name '*.app' -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "No macOS .app bundle was found."
            exit 1
          fi

          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_PATH" raiko-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: raiko-macos
          path: raiko-macos.zip
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy GitHub Pages
    needs: [validate, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
