
name: Raiko iOS Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-simulator:
    name: Build Raiko for iOS Simulator
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          xcodebuild -version

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Raiko
        run: flutter analyze
      
      - name: Build iOS IPA
        run: flutter build ipa --release --no-codesign

      
      - name: Package unsigned IPA for SideStore
        run: |
          set -euo pipefail

          APP_PATH="build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "Runner.app was not found in the Xcode archive."
            exit 1
          fi

          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/Runner.app

          # An IPA is a ZIP archive with Payload/Runner.app at its root.
          ditto -c -k --sequesterRsrc --keepParent \
            Payload raiko-ios-unsigned.ipa

          echo "Created IPA:"
          ls -lh raiko-ios-unsigned.ipa

          # Verify that the expected app bundle is inside the IPA.
          unzip -l raiko-ios-unsigned.ipa | grep 'Payload/Runner.app/'

      - name: Upload Raiko IPA
        uses: actions/upload-artifact@v4
        with:
          name: raiko-ios-ipa
          path: raiko-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

