
name: Raiko iOS Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-simulator:
    name: Build Raiko for iOS Simulator
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          xcodebuild -version

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Raiko
        run: flutter analyze

      - name: Build iOS Simulator app
        run: flutter build ios --simulator --release

      - name: Package simulator app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/iphonesimulator/Runner.app \
            raiko-ios-simulator.zip

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: raiko-ios-simulator
          path: raiko-ios-simulator.zip
          if-no-files-found: error
          retention-days: 7
